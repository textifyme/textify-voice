name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  rust:
    # macOS runner is required: the workspace links AppKit / CoreAudio.
    # arm64 (macos-14) matches the only supported target.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (the gate — fmt is deliberately not enforced here)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

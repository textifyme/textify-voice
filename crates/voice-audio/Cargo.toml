[package]
name = "voice-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Textify Voice audio I/O: WAV file decode (resample + downmix to 16 kHz mono i16), cpal-based live capture behind a small trait, macOS microphone-permission detection, and an energy-VAD-driven toggle-mode capture loop feeding voice-core's PcmRingBuffer/Endpointer. Native/IO backend crate — see SPEC.md sec 3.1-3.2."

[lints]
workspace = true

[dependencies]
voice-core = { path = "../voice-core" }
hound = "3.5"
cpal = "0.15"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }

[dev-dependencies]
